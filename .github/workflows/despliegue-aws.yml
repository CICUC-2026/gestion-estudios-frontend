name: Despliegue AWS (S3 & CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir-y-desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalación de dependencias y Build
        run: |
          npm ci
          npm run build

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sincronizar artefactos compilados con S3
        run: |
          aws s3 sync dist/ s3://cicuc-frontend-app --delete

      - name: Actualizar frontend en servidor EC2
        env:
          EC2_INSTANCE_ID: i-08ab46a4c0b14152d
          EC2_HOST: 3.224.111.136
        run: |
          # Generar clave SSH temporal
          ssh-keygen -t ed25519 -f /tmp/deploy_key -N "" -q
          # Inyectar clave publica via EC2 Instance Connect (valida 60s)
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$EC2_INSTANCE_ID" \
            --instance-os-user ec2-user \
            --ssh-public-key file:///tmp/deploy_key.pub
          sleep 2
          # Copiar build al servidor y reemplazar contenido del volumen Docker
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -r dist/* ec2-user@"$EC2_HOST":/tmp/cicuc-deploy/
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ec2-user@"$EC2_HOST" \
            "sudo rm -rf /var/lib/docker/volumes/backend_web_dist/_data/* && \
             sudo cp -r /tmp/cicuc-deploy/* /var/lib/docker/volumes/backend_web_dist/_data/ && \
             rm -rf /tmp/cicuc-deploy"

      - name: Notificar despliegue
        run: echo "Frontend sincronizado en S3 y desplegado en EC2."
