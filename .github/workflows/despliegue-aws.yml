name: Despliegue AWS (S3 & CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir-y-desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalación de dependencias y Build
        run: |
          npm ci
          npm run build

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sincronizar artefactos compilados con S3
        run: |
          aws s3 sync dist/ s3://cicuc-frontend-app --delete

      - name: Notificar despliegue S3
        run: echo "Frontend estático sincronizado correctamente en S3 cicuc-frontend-app."
